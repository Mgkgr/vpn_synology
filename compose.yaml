services:
  dashboard:
    build: .
    container_name: vpn-dashboard
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    env_file:
      - ./deploy/dashboard.env
    networks: [vpn-gateway_default]
    volumes:
      - ./deploy/data:/data
      # The nested bind mount intentionally overrides the read-only parent.
      - /volume1/docker/vpn-gateway/mihomo:/gateway:ro
      - /volume1/docker/vpn-gateway/mihomo/rules:/gateway/rules:rw
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  vpn-gateway_default:
    external: true
