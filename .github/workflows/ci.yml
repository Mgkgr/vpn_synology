name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m pytest backend/tests -q --ignore=backend/tests/test_antidpi_api.py --ignore=backend/tests/test_profile_api.py
      # These in-process IPC/API fixtures intentionally use the real root-only
      # worker stores. Keep their ownership checks intact; never mock UID=0.
      # All transport adapters are offline fixtures, not the production NAS.
      - name: Root-owned maintenance API fixtures
        run: sudo -n -- "$pythonLocation/bin/python" -m pytest backend/tests/test_antidpi_api.py backend/tests/test_profile_api.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
